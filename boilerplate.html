<!doctype html>
<html lang="en">
  <head>
    <!-- ============================================
         HTML Starter Kit
         Author: Ioannis Mastrogiannakos
         Date: 15-02-2026
         Purpose: Reference for all key HTML elements
         ============================================
    -->

    <title>Title of WebPage</title>

    <!--Basic-->
    <meta charset="UTF-8" />

    <!--Responsive Mobile Design-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--SEO-->
    <meta name="description" content="Short Page Description" />
    <meta name="keywords" content="HTML, starter, reference, tutorial" />
    <meta name="Author" content="Ioannis Mastrogiannakos" />

    <!--OG-->
    <meta property="og:title" content="Page Title" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Short Page Description" />
    <meta property="og:image" content="./images/whitecamo-navyseal.jpg" />
    <meta property="og:url" content="./" />

    <!--Favicons & Icons-->
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />

    <!--Stylesheet-->
    <link rel="stylesheet" href="./style.css" />

    <!--Scripts-->
    <script src="./js/script.js" defer></script>

    <!-- ================
         Additional Notes
         ================
         - meta tags only in <head>
         - Open Graph tags improve social media sharing
         - CSS links before scripts for faster render
         - Use deferred scripts to prevent blocking page load
    -->
  </head>
  <body></body>
</html>
